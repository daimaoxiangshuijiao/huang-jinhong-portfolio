<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c0e10"><meta name="description" content="一笔画出你的轨道：实时圆度、真实评分、轨迹回放和航迹记录卡。"><title>跃迁航迹校准 · 记录者实验室</title><link rel="icon" href="../assets/favicon.svg"><link rel="stylesheet" href="../art-fonts.css"><link rel="stylesheet" href="../type-card.css"><link rel="stylesheet" href="common.css"><link rel="stylesheet" href="studio.css"><link rel="stylesheet" href="orbit-studio.css"><link rel="preload" href="../assets/fonts/card-2026/archive-card.woff2" as="font" type="font/woff2" crossorigin><script type="module" src="orbit.js"></script></head>
<body class="lab-body lab-v2 orbit-workbench"><a class="lab-skip" href="#orbit-canvas">跳到绘图区</a><header class="lab-header"><a class="lab-brand" href="index.html"><span class="lab-slashes" aria-hidden="true"></span>记录者实验室</a><nav aria-label="实验室导航"><a href="orbit.html" aria-current="page">航迹校准</a><a href="core.html">记忆核心</a><a href="storyboard.html">分镜导演</a><a class="lab-back" href="../index.html#lab">返回作品集 <span aria-hidden="true">↗</span></a></nav></header>
<main id="main" class="orbit-arena studio-enter" aria-labelledby="orbit-heading"><img id="orbit-space" class="orbit-space" src="../assets/lab/space-depth.webp" width="1672" height="941" alt=""><img id="orbit-foreground" class="orbit-foreground" src="../assets/lab/space-foreground.webp" width="1672" height="940" alt=""><div class="orbit-reading-shade" aria-hidden="true"></div>
  <header class="orbit-title"><h1 id="orbit-heading">能画出完美轨道吗？</h1><p>按住拖动，绕中心画一圈。</p></header>
  <div class="orbit-options"><div class="orbit-modes" role="group" aria-label="挑战模式"><button id="orbit-challenge" type="button" aria-pressed="true">自由挑战</button><button id="orbit-practice" type="button" aria-pressed="false">辅助练习</button></div><button id="orbit-sound" type="button" aria-pressed="false"><svg class="studio-icon" aria-hidden="true"><use href="icons.svg#muted"/></svg><span>声音关闭</span></button></div>
  <div id="orbit-drawing" class="orbit-playfield"><img id="orbit-planet" src="../assets/lab/orbit-planet.webp" width="640" height="640" alt="绘图中心的银色行星" draggable="false"><canvas id="orbit-canvas" tabindex="0" aria-label="按住鼠标或手指，绕中心行星画一圈。松开评分；Enter重试，Esc取消。"></canvas><div class="orbit-coverage"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17"/><circle id="orbit-progress-ring" cx="20" cy="20" r="17" pathLength="100"/></svg><p><strong id="orbit-coverage-live">0%</strong><span>绘制进度</span></p></div></div>
  <aside id="orbit-result" class="orbit-scoreboard"><p id="orbit-score-label">当前圆度</p><p id="orbit-score" class="orbit-live-score">—</p><p id="orbit-grade">从任意方向开始。</p><p id="orbit-status" role="status">一笔画完，松开后查看评分。</p><div class="orbit-best-line"><span>最佳记录</span><strong id="orbit-best">—</strong></div><details class="orbit-recent"><summary>最近三次尝试</summary><ol id="orbit-history"><li>完成第一圈，留下你的记录。</li></ol></details><dl id="orbit-measurements" class="orbit-measurements" hidden><div><dt>圆度</dt><dd id="orbit-circularity">—</dd></div><div><dt>覆盖</dt><dd id="orbit-coverage">—</dd></div><div><dt>闭合</dt><dd id="orbit-closure">—</dd></div></dl><span id="orbit-last" class="visually-hidden"></span></aside>
  <div class="orbit-bottom"><p>一笔画完；试着保持到中心的距离一致。</p><div class="orbit-controls"><button id="orbit-start" type="button"><svg class="studio-icon" aria-hidden="true"><use href="icons.svg#again"/></svg><span>再画一圈</span></button><button id="orbit-download" type="button" disabled><svg class="studio-icon" aria-hidden="true"><use href="icons.svg#download"/></svg><span>保存记录卡</span></button><button id="orbit-replay" type="button" disabled><svg class="studio-icon" aria-hidden="true"><use href="icons.svg#play"/></svg><span>回放轨迹</span></button></div></div><noscript><p class="orbit-noscript">启用JavaScript后即可绘制和评分。</p></noscript>
</main></body></html>
